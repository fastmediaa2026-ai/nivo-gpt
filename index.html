<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nivo ChatGPT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            background-color: #ffffff !important;
            color: #1f2937 !important;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            height: 100vh;
            height: 100dvh; /* تتكيف بدقة مع شاشات الموبايل الحديثة */
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background-color: #f9fafb !important;
            display: flex;
            flex-direction: column;
            padding: 14px;
            border-left: 1px solid #e5e7eb;
            z-index: 100;
            transition: transform 0.3s ease;
            height: 100%;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px;
            background-color: #ffffff;
            color: #1f2937;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .new-chat-btn:hover {
            background-color: #f3f4f6;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .history-label {
            font-size: 12px;
            color: #6b7280;
            padding: 6px 8px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            color: #374151;
            font-size: 13.5px;
            cursor: pointer;
            margin-bottom: 4px;
            background: #ffffff;
            border: 1px solid #f0f0f0;
        }

        .history-item:hover {
            background-color: #f3f4f6;
        }

        .history-title-box {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            flex: 1;
        }

        .history-title-box span {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .delete-chat-btn {
            color: #9ca3af;
            padding: 4px 6px;
            cursor: pointer;
        }

        .delete-chat-btn:hover {
            color: #ef4444;
        }

        .sidebar-footer {
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
        }

        .admin-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #16a34a;
            padding: 8px 10px;
            background: rgba(22, 163, 74, 0.08);
            border-radius: 6px;
            font-weight: 600;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 90;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #ffffff !important;
            height: 100%;
            overflow: hidden;
        }

        .top-header {
            height: 55px;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #f3f4f6;
        }

        .header-right-side {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-toggle-btn {
            display: none;
            background: transparent;
            border: none;
            font-size: 18px;
            color: #374151;
            cursor: pointer;
            padding: 6px;
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo-img {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            object-fit: cover;
        }

        .branding-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .logo-title {
            font-weight: 800;
            font-size: 15px;
            color: #111827;
        }

        .logo-subtitle {
            font-size: 10.5px;
            color: #4b5563;
            font-weight: 600;
        }

        .model-dropdown {
            background-color: #ffffff;
            color: #1f2937;
            border: 1px solid #d1d5db;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        /* صندوق الشات المرن الذي يأخذ المساحة المتبقية فقط */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff !important;
        }

        .welcome-screen {
            margin-top: 12vh;
            text-align: center;
            color: #1f2937;
        }

        .welcome-icon {
            font-size: 28px;
            color: #10a37f;
            margin-bottom: 12px;
        }

        .messages-wrapper {
            width: 100%;
            max-width: 768px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-start;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 85%;
            word-break: break-word;
        }

        .message-row.user .message-bubble {
            background-color: #f3f4f6 !important;
            color: #1f2937 !important;
            border-top-right-radius: 4px;
        }

        .message-row.assistant .message-bubble {
            background-color: transparent;
            color: #374151 !important;
            padding-right: 0;
        }

        /* شريط الإدخال الثابت أسفل الشاشة تماماً */
        .input-area-wrapper {
            padding: 10px 16px 14px;
            display: flex;
            justify-content: center;
            background: #ffffff;
            border-top: 1px solid #f3f4f6;
            flex-shrink: 0;
        }

        .input-box-container {
            width: 100%;
            max-width: 768px;
            background-color: #ffffff !important;
            border-radius: 22px;
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
        }

        .attachment-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f3f4f6;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 11.5px;
        }

        .attachment-preview .file-info {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #374151;
        }

        .remove-file-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }

        textarea#userInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #1f2937 !important;
            font-size: 14px;
            resize: none;
            max-height: 120px;
            min-height: 22px;
            line-height: 22px;
            padding: 2px 0;
        }

        textarea#userInput::placeholder {
            color: #9ca3af;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #6b7280;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .send-btn {
            background-color: #f3f4f6;
            color: #1f2937;
        }

        @media (max-width: 768px) {
            .menu-toggle-btn {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                transform: translateX(100%);
                box-shadow: -4px 0 16px rgba(0,0,0,0.1);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <!-- القائمة الجانبية -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="startNewChat(); closeSidebarOnMobile();">
                    <i class="fa-solid fa-plus"></i>
                    <span>محادثة جديدة</span>
                </button>
            </div>

            <div class="chat-history">
                <div class="history-label">المحادثات السابقة</div>
                <div id="historyList"></div>
            </div>

            <div class="sidebar-footer">
                <div class="admin-badge">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>وضع المعاينة والتحكم (Admin)</span>
                </div>
            </div>
        </aside>

        <!-- منطقة الشات الرئيسية -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-right-side">
                    <button class="menu-toggle-btn" onclick="toggleSidebar()" title="القائمة">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    
                    <div class="brand-wrapper">
                        <img src="logo.png" alt="NIVO" class="brand-logo-img" onerror="this.src='https://api.iconify.design/logos:openai-icon.svg'">
                        <div class="branding-text">
                            <span class="logo-title">NIVO</span>
                            <span class="logo-subtitle">ChatGPT</span>
                        </div>
                    </div>
                </div>

                <div class="model-selector-container">
                    <select id="modelSelect" class="model-dropdown">
                        <option value="gpt-4o">GPT-4o (افتراضي)</option>
                        <option value="o3-mini">o3-mini (استنتاج سريع)</option>
                        <option value="replicate-image">توليد صور (Replicate)</option>
                    </select>
                </div>
            </header>

            <div class="chat-container" id="chatContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon"><i class="fa-solid fa-sparkles"></i></div>
                    <h2>كيف يمكنني مساعدتك اليوم؟</h2>
                </div>
                <div class="messages-wrapper" id="messagesWrapper"></div>
            </div>

            <!-- شريط الإدخال المثبت أسفل الشاشة -->
            <div class="input-area-wrapper">
                <div class="input-box-container">
                    
                    <div class="attachment-preview" id="attachmentPreview" style="display: none;">
                        <div class="file-info">
                            <i class="fa-solid fa-file" id="fileIcon"></i>
                            <span id="fileName">document.pdf</span>
                        </div>
                        <button class="remove-file-btn" onclick="removeAttachment()"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <div class="input-row">
                        <button class="icon-btn attach-btn" title="إرفاق ملف" onclick="document.getElementById('fileInput').click()">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelected(event)">

                        <textarea id="userInput" placeholder="اكتب رسالتك أو اطلب تحليلاً..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>

                        <button class="icon-btn send-btn" id="sendBtn" title="إرسال" onclick="sendMessage()">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script>
        let currentChatId = Date.now().toString();
        let chatsHistory = JSON.parse(localStorage.getItem('nivo_chats_v3') || '{}');
        let activeAttachment = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderHistoryList();
            loadChat(currentChatId);
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function closeSidebarOnMobile() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            removeAttachment();
            document.getElementById('messagesWrapper').innerHTML = '';
            document.getElementById('welcomeScreen').style.display = 'block';
        }

        function renderHistoryList() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            const chatIds = Object.keys(chatsHistory);
            if (chatIds.length === 0) {
                historyList.innerHTML = '<div style="font-size: 12px; color: #9ca3af; padding: 8px; text-align: center;">لا توجد محادثات سابقة</div>';
                return;
            }

            chatIds.reverse().forEach(id => {
                const chatTitle = chatsHistory[id].title || 'محادثة';
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div class="history-title-box">
                        <i class="fa-regular fa-message" style="color: #6b7280; font-size: 12px;"></i>
                        <span>${chatTitle}</span>
                    </div>
                    <i class="fa-solid fa-trash delete-chat-btn" onclick="deleteChat(event, '${id}')"></i>
                `;
                item.onclick = () => {
                    loadChat(id);
                    closeSidebarOnMobile();
                };
                historyList.appendChild(item);
            });
        }

        function loadChat(id) {
            currentChatId = id;
            const messagesWrapper = document.getElementById('messagesWrapper');
            const welcomeScreen = document.getElementById('welcomeScreen');
            messagesWrapper.innerHTML = '';

            if (chatsHistory[id] && chatsHistory[id].messages.length > 0) {
                welcomeScreen.style.display = 'none';
                chatsHistory[id].messages.forEach(msg => {
                    appendMessageUI(msg.role, msg.content, msg.attachment);
                });
            } else {
                welcomeScreen.style.display = 'block';
            }
        }

        function deleteChat(event, id) {
            event.stopPropagation();
            delete chatsHistory[id];
            localStorage.setItem('nivo_chats_v3', JSON.stringify(chatsHistory));
            if (currentChatId === id) startNewChat();
            renderHistoryList();
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            activeAttachment = {
                name: file.name,
                size: (file.size / 1024).toFixed(1) + ' KB',
                type: file.type
            };

            document.getElementById('fileName').innerText = activeAttachment.name + ' (' + activeAttachment.size + ')';
            document.getElementById('attachmentPreview').style.display = 'flex';
        }

        function removeAttachment() {
            activeAttachment = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('attachmentPreview').style.display = 'none';
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            const model = document.getElementById('modelSelect').value;

            if (!text && !activeAttachment) return;

            document.getElementById('welcomeScreen').style.display = 'none';

            const userMessageData = {
                role: 'user',
                content: text,
                attachment: activeAttachment ? { ...activeAttachment } : null
            };

            appendMessageUI('user', text, activeAttachment);
            
            const firstUserMsg = text || (activeAttachment ? 'مرفق: ' + activeAttachment.name : 'محادثة');
            saveMessageToHistory(userMessageData, firstUserMsg);

            inputField.value = '';
            inputField.style.height = 'auto';
            removeAttachment();

            const loadingId = 'loading-' + Date.now();
            appendMessageUI('assistant', '<i class="fa-solid fa-spinner fa-spin"></i> جاري توليد الرد...', null, loadingId);

            setTimeout(() => {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) {
                    const previewReply = '[معاينة وضع ' + model + ']: تم استلام طلبك بنجاح. الواجهة جاهزة بالكامل لربط استدعاء السيرفر عند التنفيذ.';
                    loadingElement.innerHTML = previewReply;
                    saveMessageToHistory({ role: 'assistant', content: previewReply });
                }
            }, 1000);
        }

        function appendMessageUI(role, text, attachment, elementId) {
            const messagesWrapper = document.getElementById('messagesWrapper');
            const row = document.createElement('div');
            row.className = 'message-row ' + role;
            if (elementId) row.id = elementId;

            let attachmentHtml = '';
            if (attachment) {
                attachmentHtml = '<div style="font-size: 12px; background: rgba(0,0,0,0.06); padding: 4px 8px; border-radius: 6px; margin-bottom: 6px; display: inline-flex; align-items: center; gap: 6px;"><i class="fa-solid fa-paperclip"></i><span>' + attachment.name + '</span></div><br>';
            }

            row.innerHTML = '<div class="message-bubble">' + attachmentHtml + '<div>' + text + '</div></div>';

            messagesWrapper.appendChild(row);
            document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
        }

        function saveMessageToHistory(msgObj, newTitle) {
            if (!chatsHistory[currentChatId]) {
                chatsHistory[currentChatId] = {
                    title: newTitle ? newTitle.slice(0, 24) : 'محادثة',
                    messages: []
                };
            }
            chatsHistory[currentChatId].messages.push(msgObj);
            localStorage.setItem('nivo_chats_v3', JSON.stringify(chatsHistory));
            renderHistoryList();
        }
    </script>
</body>
</html>
